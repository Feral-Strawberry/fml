<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-label="The browser talks to the web process over HTTP. The web process reads the database, writes only short changes itself and hands long-running tasks through a queue to the worker process, which does the long writes and reads and copies files.">
        <style>
  svg { --surface: #FFFFFF; --bg-2: #F6F8FA; --ink: #17202B; --ink-2: #4A5665; --ink-3: #7B8794;
        --line: #D6DCE4; --line-strong: #AEB8C4; --accent: #B02A4C; --l1: #1F7A7E; --l2: #4653B8; --man: #A66A12; }
  @media (prefers-color-scheme: dark) {
    svg { --surface: #1C232C; --bg-2: #232B35; --ink: #E8ECF1; --ink-2: #B3BCC7; --ink-3: #7E8894;
          --line: #2C3641; --line-strong: #46525F; --accent: #E0637F; --l1: #4FB5B9; --l2: #8C97EA; --man: #D9A24A; }
  }
  text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ground { fill: var(--surface); }
  .bx { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; }
  .bi { fill: var(--bg-2); stroke: var(--line); stroke-width: 1; }
  .proc { fill: none; stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 6 5; }
  .opt { stroke-dasharray: 5 4; }
  .ln { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
  .lw { fill: none; stroke: var(--accent); stroke-width: 2; }
  .ah { fill: var(--ink-2); }
  .ahw { fill: var(--accent); }
  .h { fill: var(--ink); font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif; font-size: 16px; font-weight: 600; }
  .t { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .s { fill: var(--ink-3); font-size: 11.5px; }
  .lbl { fill: var(--ink-2); font-size: 11.5px; }
  .lblw { fill: var(--accent); font-size: 11.5px; font-weight: 600; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .l1 { stroke: var(--l1); stroke-width: 1.6; } .tl1 { fill: var(--l1); }
  .l2 { stroke: var(--l2); stroke-width: 1.6; } .tl2 { fill: var(--l2); }
  .man { stroke: var(--man); stroke-width: 1.6; } .tman { fill: var(--man); }
</style>
        <rect class="ground" x="0" y="0" width="1240" height="600" rx="8"/>
        <defs>
          <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
          <marker id="wA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahw"/></marker>
        </defs>

        <!-- Browser -->
        <rect x="16" y="40" width="180" height="340" rx="8" class="bx"/>
        <text x="106" y="64" text-anchor="middle" class="h">Browser</text>
        <rect x="30" y="84" width="152" height="56" rx="4" class="bi"/>
        <text x="106" y="107" text-anchor="middle" class="t">Gallery</text>
        <text x="106" y="126" text-anchor="middle" class="s mono">/ · index.html</text>
        <rect x="30" y="152" width="152" height="56" rx="4" class="bi"/>
        <text x="106" y="175" text-anchor="middle" class="t">Admin</text>
        <text x="106" y="194" text-anchor="middle" class="s mono">/admin</text>
        <rect x="30" y="220" width="152" height="76" rx="4" class="bi"/>
        <text x="106" y="243" text-anchor="middle" class="t">ES modules</text>
        <text x="106" y="262" text-anchor="middle" class="s">event bus</text>
        <text x="106" y="280" text-anchor="middle" class="s">no frontend deps</text>
        <rect x="30" y="308" width="152" height="56" rx="4" class="bi"/>
        <text x="106" y="331" text-anchor="middle" class="t">localStorage</text>
        <text x="106" y="350" text-anchor="middle" class="s">language · theme · zoom</text>

        <!-- HTTP -->
        <line x1="196" y1="104" x2="336" y2="104" class="ln" marker-start="url(#aA)" marker-end="url(#aA)"/>
        <text x="246" y="96" text-anchor="middle" class="lbl">HTTP</text>
        <text x="246" y="121" text-anchor="middle" class="lbl mono">127.0.0.1:8765</text>
        <text x="246" y="137" text-anchor="middle" class="lbl">status poll 0.7 s</text>

        <!-- Web-Prozess -->
        <rect x="296" y="24" width="420" height="504" rx="10" class="proc"/>
        <text x="312" y="48" class="h">Web process</text>
        <text x="312" y="66" class="s">uvicorn + FastAPI · one process per instance</text>
        <rect x="336" y="84" width="360" height="40" rx="4" class="bi"/>
        <text x="516" y="109" text-anchor="middle" class="t">Middleware: host guard · slow log</text>
        <line x1="516" y1="124" x2="516" y2="140" class="ln" marker-end="url(#aA)"/>
        <rect x="336" y="140" width="360" height="40" rx="4" class="bi"/>
        <text x="516" y="165" text-anchor="middle" class="t">Routes <tspan class="mono">/api/*</tspan> · thin shell</text>
        <rect x="336" y="200" width="360" height="56" rx="4" class="bi"/>
        <text x="516" y="223" text-anchor="middle" class="t">Engine: queue · dispatcher</text>
        <text x="516" y="243" text-anchor="middle" class="s">supervision: worker crash → restart</text>
        <rect x="336" y="280" width="360" height="40" rx="4" class="bi"/>
        <text x="516" y="305" text-anchor="middle" class="t">Watcher per watch folder · quiet time</text>
        <line x1="600" y1="280" x2="600" y2="256" class="ln" marker-end="url(#aA)"/>
        <text x="608" y="273" class="lbl">file ready</text>
        <rect x="336" y="340" width="360" height="56" rx="4" class="bi"/>
        <text x="516" y="363" text-anchor="middle" class="t">Read: library + filters</text>
        <text x="516" y="383" text-anchor="middle" class="s">epoch cache: hits · counts · sidebar</text>
        <rect x="336" y="412" width="360" height="52" rx="4" class="bi"/>
        <text x="516" y="433" text-anchor="middle" class="t">Short writes: <tspan class="mono">run_write</tspan> + lock</text>
        <text x="516" y="452" text-anchor="middle" class="s">rating · tags · notes · duels</text>
        <rect x="336" y="476" width="360" height="40" rx="4" class="bi"/>
        <text x="516" y="501" text-anchor="middle" class="t">Media: thumbs · stream · preview</text>
        <!-- Routen verteilen -->
        <path d="M336,160 H320 V496" class="ln"/>
        <line x1="320" y1="228" x2="336" y2="228" class="ln" marker-end="url(#aA)"/>
        <line x1="320" y1="368" x2="336" y2="368" class="ln" marker-end="url(#aA)"/>
        <line x1="320" y1="438" x2="336" y2="438" class="ln" marker-end="url(#aA)"/>
        <line x1="320" y1="496" x2="336" y2="496" class="ln" marker-end="url(#aA)"/>

        <!-- Engine <-> Worker -->
        <line x1="696" y1="212" x2="880" y2="212" class="ln" marker-end="url(#aA)"/>
        <text x="788" y="204" text-anchor="middle" class="lbl">task · queue</text>
        <line x1="880" y1="244" x2="696" y2="244" class="ln" marker-end="url(#aA)"/>
        <text x="788" y="262" text-anchor="middle" class="lbl">progress · queue</text>

        <!-- Lesen / Schreiben / Medien -->
        <line x1="696" y1="368" x2="880" y2="368" class="ln" marker-end="url(#aA)"/>
        <text x="788" y="360" text-anchor="middle" class="lbl">reads (WAL)</text>
        <path d="M696,438 H848 V392 H880" class="lw" marker-end="url(#wA)"/>
        <text x="704" y="430" class="lblw">short writes</text>
        <line x1="696" y1="496" x2="880" y2="496" class="ln" marker-end="url(#aA)"/>
        <text x="788" y="488" text-anchor="middle" class="lbl">streams files</text>

        <!-- Worker-Prozess -->
        <rect x="880" y="24" width="344" height="252" rx="10" class="proc"/>
        <text x="896" y="48" class="h">Worker process</text>
        <text x="896" y="66" class="s">spawn · one task at a time</text>
        <rect x="896" y="84" width="312" height="72" rx="4" class="bi"/>
        <text x="1052" y="106" text-anchor="middle" class="t">Tasks</text>
        <text x="1052" y="125" text-anchor="middle" class="s mono">scan · import · rescan · reparse</text>
        <text x="1052" y="143" text-anchor="middle" class="s mono">thumb_warm · moveout · vacuum · …</text>
        <rect x="896" y="168" width="152" height="48" rx="4" class="bi"/>
        <text x="972" y="188" text-anchor="middle" class="t">Process pool</text>
        <text x="972" y="206" text-anchor="middle" class="s">reparse, on request</text>
        <rect x="1056" y="168" width="152" height="48" rx="4" class="bi"/>
        <text x="1132" y="188" text-anchor="middle" class="t">Thumb pool</text>
        <text x="1132" y="206" text-anchor="middle" class="s">pre-warming</text>
        <rect x="896" y="228" width="312" height="36" rx="4" class="bi"/>
        <text x="1052" y="251" text-anchor="middle" class="t">ffprobe · ffmpeg <tspan class="s">(subprocess)</tspan></text>

        <!-- Worker -> DB / FS -->
        <line x1="1008" y1="276" x2="1008" y2="312" class="lw" marker-end="url(#wA)"/>
        <text x="1016" y="298" class="lblw">writes long tasks</text>
        <line x1="1190" y1="276" x2="1190" y2="464" class="ln" marker-end="url(#aA)"/>
        <text x="1206" y="370" text-anchor="middle" class="lbl" transform="rotate(90 1206 370)">reads · copies · renders</text>

        <!-- Datenbank -->
        <path d="M880,324 V404 A128,12 0 0 0 1136,404 V324 Z" class="bx"/>
        <ellipse cx="1008" cy="324" rx="128" ry="12" class="bx"/>
        <text x="1008" y="360" text-anchor="middle" class="t mono">feral.sqlite</text>
        <text x="1008" y="379" text-anchor="middle" class="s">SQLite · WAL · migrations</text>
        <text x="1008" y="397" text-anchor="middle" class="s">one writer per kind of task</text>

        <!-- Dateisystem -->
        <rect x="880" y="464" width="344" height="124" rx="8" class="bx"/>
        <text x="896" y="488" class="h">File system</text>
        <text x="896" y="512" class="lbl">source and watch folders</text>
        <text x="896" y="532" class="lbl">Media Library <tspan class="mono">YYYY/MM/DD/</tspan></text>
        <text x="896" y="552" class="lbl mono">cache/thumbnails/</text>
        <text x="896" y="572" class="lbl mono">logs/ · config.toml</text>
      </svg>
