<!doctype html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Feral Media Library</title>
<link rel="icon" type="image/png" href="/static/img/feral-strawberry.png">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

<!-- Admin ist ein eigenes Dokument (ADR 0074): Seitennavigation links,
     Seitenbereich rechts. Die Navi-Einträge und das Aktivitäts-Widget baut
     js/admin/main.js aus dem Seitenregister (register.js). -->
<nav id="adnav">
  <div class="brand">
    <img class="mascot" src="/static/img/feral-strawberry.png" alt="">
    <div><div class="t1">Feral Media Library</div><div class="t2" id="brandSub">Admin</div></div>
  </div>
  <!-- Rückweg ist ein echter Seitenwechsel (kein Overlay mehr). -->
  <a class="back" id="adBack" href="/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span id="adBackLabel"></span></a>
  <div class="navlist" id="navlist"></div>
  <div class="navfoot">
    <!-- Aktivität auf jeder Seite sichtbar; Klick führt zur Übersicht. -->
    <a class="actw" id="actw" href="/admin/overview">
      <div class="row"><span class="dot idle" id="wDot"></span><span class="task" id="wTask"></span></div>
      <div class="meta"><span id="wCount"></span><span id="wRight"></span></div>
      <div class="bar"><i id="wBar" style="width:0%"></i></div>
    </a>
    <div class="navmeta"><span class="pill" id="navInstance" hidden></span><span class="mono" id="navMeta"></span></div>
  </div>
</nav>

<main id="adpage">
  <section class="page" id="page">
    <div class="phead">
      <div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
      <div id="pageHead"></div>
    </div>
    <div id="pageBody"></div>
  </section>
</main>

<script type="module" src="/static/js/admin/main.js"></script>
</body>
</html>
